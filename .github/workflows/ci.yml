name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # -------------------------
  # Frontend - lint and build
  # -------------------------
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/ --ext .js,.jsx --max-warnings 0

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5001/api
          VITE_USE_REAL_API: false
          VITE_FORECAST_API: http://localhost:5001/api/analytics/forecast
          VITE_RECOMMEND_API: http://localhost:5001/api/quests/recommendations

  # -------------------------
  # Backend - install check
  # -------------------------
  backend:
    name: Backend (install check)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Smoke test - server starts
        run: |
          PORT=5001 ML_SERVICE_URL=http://localhost:5002 node -e "
            const server = require('./server.js');
          " || true
        timeout-minutes: 1

  # -------------------------
  # ML - dependency check
  # -------------------------
  ml:
    name: ML service (dependency check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Syntax check
        run: python -m py_compile ml/app.py
