name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # -------------------------
  # Frontend - lint and build
  # -------------------------
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/ --ext .js,.jsx

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5001/api
          VITE_USE_REAL_API: false
          VITE_FORECAST_API: http://localhost:5001/api/analytics/forecast
          VITE_RECOMMEND_API: http://localhost:5001/api/quests/recommendations

  # -------------------------
  # Backend - install and syntax check
  # -------------------------
  backend:
    name: Backend (install + syntax)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js

  # -------------------------
  # ML - syntax and import check
  # -------------------------
  ml:
    name: ML service (syntax check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask flask-cors pandas numpy python-dotenv requests prophet

      - name: Syntax check
        run: python -m py_compile ml/app.py
